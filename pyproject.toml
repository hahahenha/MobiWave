[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mobiwave-dispatch"
version = "0.1.0"
description = "MobiWave vehicle dispatch with drift-guided layer-selective adaptation."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "torch>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.12"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
